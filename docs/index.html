  .highlight-card .gap { font-size: 0.9rem; margin-top: 4px; }
  .gap.zero { color: var(--green); }
  .gap.nonzero { color: var(--text-dim); }
  table {
    border-collapse: collapse;
    width: 100%;
    margin-bottom: 36px;
    font-size: 0.88rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;

  }
  th, td {

    border-bottom: 1px solid var(--border);

  th {
    background: #1c2129;
    color: var(--text-dim);
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  tr.region-head td {
    background: #1c2129;
    font-weight: 700;
    color: var(--accent);
    text-align: left;
  }
  .table-wrap { overflow-x: auto; }
  .conf { color: var(--text-dim); font-size: 0.78rem; }
  .fail { color: var(--red); }
  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 20px;
  }
  .chart-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .chart-card h3 { margin: 0 0 8px 0; font-size: 0.95rem; }
  .chart-card canvas { max-height: 240px; }
  .region-section h2 {

    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    margin-top: 32px;
  }
  a { color: var(--accent); }
  footer { color: var(--text-dim); font-size: 0.8rem; margin-top: 40px; }

      '<td>' + gapCell + '</td>' +
      '<td class="conf">' + (v.last_checked_confidence || '-') + '</td>' +
      '<td>' + fmtDate(v.last_checked_at) + '</td>';
    tbody.appendChild(tr);
  });
});

// ---- Charts by region ----
const container = document.getElementById("chartsByRegion");
const palette = ["#58a6ff", "#3fb950", "#d29922", "#f85149", "#bc8cff", "#39c5cf", "#f778ba", "#ffa657", "#79c0ff"];

REGION_ORDER.forEach(region => {
  const routesInRegion = Object.entries(HISTORY).filter(([k, v]) => v.region === region).map(([k]) => k);
  if (routesInRegion.length === 0) return;

  const section = document.createElement("div");
  section.className = "region-section";
  section.innerHTML = '<h2>' + region + '</h2>';
  const grid = document.createElement("div");
  grid.className = "charts-grid";
  section.appendChild(grid);
  container.appendChild(section);

  routesInRegion.forEach((routeKey, idx) => {
    const meta = HISTORY[routeKey];
    const routeSamples = SAMPLES.filter(s => s.route === routeKey).sort((a, b) => a.ts.localeCompare(b.ts));

    const card = document.createElement("div");
    card.className = "chart-card";
    const canvasId = "chart_" + routeKey;
    card.innerHTML = '<h3>' + meta.name_ko + '</h3><canvas id="' + canvasId + '"></canvas>';
    grid.appendChild(card);

    const ctx = document.getElementById(canvasId).getContext("2d");
    const color = palette[idx % palette.length];

    new Chart(ctx, {
      type: "line",
      data: {
        labels: routeSamples.map(s => fmtDate(s.ts)),
        datasets: [
          {
            label: meta.name_ko + " 조회가",
            data: routeSamples.map(s => s.price_krw),
            borderColor: color,
            backgroundColor: color + "33",
            tension: 0.2,
            pointRadius: 3,
            fill: false,
          },
          {
            label: "역대 최저가",
            data: routeSamples.map(() => meta.lowest_price_krw),
            borderColor: "#8b949e",
            borderDash: [6, 4],
            pointRadius: 0,
            fill: false,
          },
        ],
      },
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: "#c9d1d9", font: { size: 10 } } },
        },
        scales: {
          x: { ticks: { color: "#8b949e", font: { size: 9 } }, grid: { color: "#30363d" } },
          y: { ticks: { color: "#8b949e", callback: v => (v / 10000) + "만" }, grid: { color: "#30363d" } },
        },
      },
    });
  });
});
</script>
</body>
</html>
